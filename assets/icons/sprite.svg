    <!-- Brand Mark: Circular Emblem -->
    <symbol id="icon-logo" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="98" fill="#111317" stroke="#23272F" stroke-width="2"/>
      <text x="100" y="93" text-anchor="middle" fill="#FFFFFF" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="33" font-weight="900" letter-spacing="0.5">Celsior</text>
      <!-- Sweeping Roofline -->
      <path d="M 72 118 C 86 106, 114 104, 142 113 C 154 117, 166 122, 172 120" fill="none" stroke="#F2F7FC" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Dynamic Shoulder and Beltline -->
