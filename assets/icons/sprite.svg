      <text x="69" y="49" fill="#94A3B8" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="3.8">DETAILING STUDIO</text>
