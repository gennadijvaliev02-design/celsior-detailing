        <path d="M 72 118 C 86 106, 114 104, 142 113 C 154 117, 166 122, 172 120" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 32 135 C 44 130, 58 128, 86 127 C 114 126, 140 123, 168 124 C 173 124, 178 122, 172 120 C 162 121, 140 120, 115 122 C 78 124, 52 128, 38 133 Z" fill="#FFFFFF"/>
        <path d="M 32 135 C 26 137, 21 139, 25 138 C 29 137, 35 135, 41 134" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
        <line x1="76" y1="139" x2="130" y2="139" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
