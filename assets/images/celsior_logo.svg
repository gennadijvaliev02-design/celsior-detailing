<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="celsiorGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D8E2EC" />
    </linearGradient>
  </defs>
  <!-- Background badge circle -->
  <circle cx="100" cy="100" r="98" fill="#111317" stroke="#23272F" stroke-width="2"/>
  
  <!-- Wordmark "Celsior" in bold automotive grotesque typography -->
  <text x="100" y="93" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        font-family="system-ui, -apple-system, 'Montserrat', 'Manrope', 'Inter', sans-serif" 
        font-size="33" 
        font-weight="900" 
        letter-spacing="0.5">Celsior</text>
        
  <!-- Car Silhouette: Sleek aerodynamic sports coupe profile (Porsche GT / Aston Martin style) -->
  <!-- 1. Sweeping Roofline: from hood/A-pillar base, arching over greenhouse, cascading to rear ducktail -->
  <path d="M 72 118 C 86 106, 114 104, 142 113 C 154 117, 166 122, 172 120" 
        fill="none" stroke="url(#celsiorGlow)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        
  <!-- 2. Dynamic Shoulder & Beltline: sweeping from front nose flare to rear spoiler kickup -->
  <path d="M 32 135 C 44 130, 58 128, 86 127 C 114 126, 140 123, 168 124 C 173 124, 178 122, 172 120 C 162 121, 140 120, 115 122 C 78 124, 52 128, 38 133 Z" 
        fill="#FFFFFF"/>

  <!-- 3. Front Nose Splitter Scoop: dynamic lower intake crease -->
  <path d="M 32 135 C 26 137, 21 139, 25 138 C 29 137, 35 135, 41 134" 
        fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 4. Ground Clearance / Rocker Panel Accent: horizontal underbody baseline -->
  <line x1="76" y1="139" x2="130" y2="139" 
        stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
</svg>
